services:
  db:
    image: postgres:17
    container_name: gamestore-db
    environment:
      POSTGRES_DB: gamestore
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 2004
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d gamestore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
